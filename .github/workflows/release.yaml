name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional upstream release tag
        required: false
        type: string
        default: ""
      force:
        description: Force rebuild (ignore already-latest skip)
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * *"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run lint
        run: make lint
      - name: Build geosite
        id: build
        run: |
          go run -v .
        env:
          FIXED_RELEASE: ${{ inputs.tag }}
          NO_SKIP: ${{ inputs.force }}
      - name: Generate sha256 hash
        if: steps.build.outputs.skip != 'true'
        run: |
          sha256sum geosite.db > geosite.db.sha256sum
          sha256sum geosite-min.db > geosite-min.db.sha256sum
      - name: Generate sha256 hash for rule sets
        if: steps.build.outputs.skip != 'true'
        run: |
          cd rule-set && sha256sum *.srs > rule-set.sha256sum && cd ..
          cd rule-set-unstable && sha256sum *.srs > rule-set-unstable.sha256sum && cd ..
      - name: Push rule-set branch
        if: steps.build.outputs.skip != 'true'
        uses: ./.github/actions/push-branch
        with:
          branch: rule-set
          files: |
            rule-set
            rule-set-unstable
      - name: Push release branch
        if: steps.build.outputs.skip != 'true'
        uses: ./.github/actions/push-branch
        with:
          branch: release
          files: |
            geosite.db
            geosite.db.sha256sum
            geosite-min.db
            geosite-min.db.sha256sum
      - uses: dev-drprasad/delete-older-releases@v0.3.4
        if: steps.build.outputs.skip != 'true'
        with:
          keep_latest: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release geosite
        if: steps.build.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          files: |
            geosite.db
            geosite.db.sha256sum
            geosite-min.db
            geosite-min.db.sha256sum
            rule-set/*.srs
            rule-set/rule-set.sha256sum
            rule-set-unstable/*.srs
            rule-set-unstable/rule-set-unstable.sha256sum
