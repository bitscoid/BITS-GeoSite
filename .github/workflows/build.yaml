name: Build
on:
  push:
    branches:
      - main
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run checks
        run: |
          go test ./...
          go vet ./...
          make lint
      - name: Build geosite
        id: build
        env:
          NO_SKIP: true
        run: |
          go run -v .
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: geosite-build
          if-no-files-found: error
          path: |
            geosite.db
            geosite-min.db
            rule-set/
            rule-set-unstable/
