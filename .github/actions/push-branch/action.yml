name: Push files to branch
description: Force-push generated files to a dedicated branch
inputs:
  branch:
    required: true
  files:
    required: true
runs:
  using: composite
  steps:
    - name: Sync files to branch
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        FILES: ${{ inputs.files }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        workdir="_publish_${BRANCH}"
        rm -rf "$workdir"
        mkdir -p "$workdir"
        cd "$workdir"
        git init -q
        git config user.email "github-action@users.noreply.github.com"
        git config user.name "GitHub Action"
        git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git checkout -B "$BRANCH"
        cd ..
        while IFS= read -r src; do
          [ -n "$src" ] || continue
          cp -r "$src" "$workdir"/
        done <<< "$FILES"
        cd "$workdir"
        git add -A
        if git diff --cached --quiet; then
          exit 0
        fi
        git commit -m "Update $BRANCH"
        git push --force origin "$BRANCH"
